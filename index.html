<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera VentaniYA - Soluciones 1001</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --neon-cyan: #00f3ff;
      --panel-bg: #161b33;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      text-align: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
    }

    .controls-panel {
      flex: 1 1 350px;
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,243,255,0.1);
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .preview-panel {
      flex: 1 1 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #a0aec0;
    }

    input[type="text"], select, input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f1322;
      color: #fff;
      box-sizing: border-box;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--neon-cyan);
      outline: none;
      box-shadow: 0 0 5px var(--neon-cyan);
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #000;
    }

    .btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-freeze {
      background: #ff9900;
      color: #000;
      box-shadow: 0 0 10px #ff9900;
    }

    .btn-freeze.active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .btn-download {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .btn-download:hover {
      background: #00c4d0;
      box-shadow: 0 0 25px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <h1>VentaniYA Soluciones 1001 — Vidriera de Ventas</h1>

  <div class="container">
    <div class="controls-panel">
      <h3>Edición del Aviso Publicitario</h3>
      
      <div class="form-group">
        <label for="imageSelect">Seleccionar Estampilla Fija (GitHub)</label>
        <select id="imageSelect">
          <option value="">Cargando imágenes de GitHub...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="localImgInput">O Seleccionar Estampilla desde Tu Equipo</label>
        <input type="file" id="localImgInput" accept="image/*">
      </div>

      <hr style="border-color: rgba(0, 243, 255, 0.2); margin: 20px 0;">

      <div class="form-group">
        <label for="addressInput">Texto Dirección</label>
        <input type="text" id="addressInput" value="Av. Principal 1234, Local 5">
      </div>

      <div class="form-group">
        <label for="phoneInput">Texto Teléfono / WhatsApp</label>
        <input type="text" id="phoneInput" value="+54 9 11 5555-4321">
      </div>

      <div class="form-group">
        <label for="emailInput">Texto Correo / Contacto</label>
        <input type="text" id="emailInput" value="contacto@ventaniya.com">
      </div>

      <div class="form-group">
        <label for="logoInput">Logo del Aviso Publicitario</label>
        <input type="file" id="logoInput" accept="image/*">
      </div>

      <button class="btn btn-freeze" id="freezeBtn">❄️ Fijar / Congelar Hora Actual</button>
      <button class="btn btn-download" id="downloadBtn">📥 Descargar Publicidad Fija (PNG)</button>
    </div>

    <div class="preview-panel">
      <canvas id="mainCanvas" width="1000" height="750"></canvas>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'ofispaciospaseo-del';
    const GITHUB_REPO = 'vidrierajet';
    const FOLDER_PATH = 'assets/images';

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imageSelect = document.getElementById('imageSelect');
    const localImgInput = document.getElementById('localImgInput');
    const addressInput = document.getElementById('addressInput');
    const phoneInput = document.getElementById('phoneInput');
    const emailInput = document.getElementById('emailInput');
    const logoInput = document.getElementById('logoInput');
    const freezeBtn = document.getElementById('freezeBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let baseImage = new Image();
    let uploadedLogo = null;
    let currentHash = generateHash();
    let isFrozen = false;
    let frozenDate = null;

    baseImage.crossOrigin = "anonymous";

    async function fetchRepoImages() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`);
        if (!response.ok) throw new Error('Error al acceder a GitHub');
        
        const files = await response.json();
        const imageFiles = files.filter(file => file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i));

        imageSelect.innerHTML = '';

        if (imageFiles.length === 0) {
          imageSelect.innerHTML = '<option value="">Sin imágenes en assets/images</option>';
          return;
        }

        imageFiles.forEach((file, index) => {
          const option = document.createElement('option');
          option.value = file.download_url;
          option.textContent = `Estampilla ${String(index + 1).padStart(3, '0')} - ${file.name}`;
          imageSelect.appendChild(option);
        });

        baseImage.src = imageFiles[0].download_url;

      } catch (error) {
        imageSelect.innerHTML = '<option value="">Elige una foto local abajo</option>';
      }
    }

    imageSelect.addEventListener('change', (e) => {
      if (e.target.value) {
        baseImage.src = e.target.value;
      }
    });

    localImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          baseImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedLogo = new Image();
          uploadedLogo.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    freezeBtn.addEventListener('click', () => {
      isFrozen = !isFrozen;
      if (isFrozen) {
        frozenDate = new Date();
        freezeBtn.textContent = '▶️ Soltar Reloj (Volver a Vivo)';
        freezeBtn.classList.add('active');
      } else {
        freezeBtn.textContent = '❄️ Fijar / Congelar Hora Actual';
        freezeBtn.classList.remove('active');
      }
    });

    function generateHash() {
      return 'ID-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
    }

    function drawCanvas(fixedDate = null) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. DIBUJAR IMAGEN BASE FIJA
      if (baseImage.complete && baseImage.naturalWidth !== 0) {
        ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Degradado inferior para lectura del reloj
      const gradient = ctx.createLinearGradient(0, canvas.height - 200, 0, canvas.height);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, canvas.height - 200, canvas.width, 200);

      // 2. RELOJ CASIO 80s DIGITAL EN MILISEGUNDOS
      const now = fixedDate || (isFrozen && frozenDate ? frozenDate : new Date());
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      const ms = String(now.getMilliseconds()).padStart(3, '0');
      
      const timeStr = `${hrs}:${mins}:${secs}.${ms}`;
      const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();

      ctx.font = '900 42px "Orbitron", monospace';
      ctx.fillStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 12;
      ctx.textAlign = 'left';
      ctx.fillText(timeStr, 30, canvas.height - 110);

      ctx.font = '700 18px "Roboto", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.fillText(dateStr, 30, canvas.height - 75);

      ctx.font = '14px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`HASH: ${currentHash}`, 30, canvas.height - 45);

      // 3. SELLO POSTAL ATÓMICO NEÓN CELESTE (VentaniYA 1001)
      ctx.save();
      const stampX = canvas.width - 140;
      const stampY = canvas.height - 110;

      ctx.strokeStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.arc(stampX, stampY, 65, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.setLineDash([6, 4]);
      ctx.arc(stampX, stampY, 58, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = '900 12px "Orbitron", sans-serif';
      ctx.fillStyle = '#00f3ff';
      ctx.textAlign = 'center';
      ctx.fillText("VentaniYA", stampX, stampY - 15);
      ctx.font = '700 10px "Roboto", sans-serif';
      ctx.fillText("SOLUCIONES", stampX, stampY + 5);
      ctx.font = '900 16px "Orbitron", sans-serif';
      ctx.fillText("1001", stampX, stampY + 25);
      ctx.restore();

      // 4. BANNER PUBLICITARIO SUPERPUESTO Y EDITABLE
      ctx.fillStyle = 'rgba(12, 15, 29, 0.85)';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.fillRect(30, 30, canvas.width - 60, 100);
      ctx.strokeRect(30, 30, canvas.width - 60, 100);

      let textOffsetX = 50;
      if (uploadedLogo && uploadedLogo.complete) {
        ctx.drawImage(uploadedLogo, 45, 40, 80, 80);
        textOffsetX = 145;
      }

      ctx.textAlign = 'left';
      ctx.font = '700 18px "Roboto", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`📍 Dir: ${addressInput.value}`, textOffsetX, 60);
      ctx.fillText(`📞 Tel: ${phoneInput.value}`, textOffsetX, 90);
      ctx.fillText(`✉️ Mail: ${emailInput.value}`, textOffsetX, 115);
    }

    function renderLoop() {
      drawCanvas();
      requestAnimationFrame(renderLoop);
    }

    fetchRepoImages();
    requestAnimationFrame(renderLoop);

    // BOTÓN DE DESCARGA: CONGELA EL MOMENTO EXACTO Y DESCARGA EL PNG FIJO
    downloadBtn.addEventListener('click', () => {
      const exportDate = isFrozen && frozenDate ? frozenDate : new Date();
      drawCanvas(exportDate);

      const link = document.createElement('a');
      link.download = `Publicidad_VentaniYA_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
